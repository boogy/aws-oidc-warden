<rect x="486" y="282" width="20.799999999999997" height="14" rx="2" fill="#f5f5f5"/>
<text x="490" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">NO</text>
<rect x="486" y="418" width="27.2" height="14" rx="2" fill="#f5f5f5"/>
<text x="490" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">YES</text>
