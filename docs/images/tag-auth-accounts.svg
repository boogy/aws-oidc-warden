<text x="480.0" y="120.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Parse the account ID</text>
<polygon points="480,160 650,216 480,272 310,216" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="212" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Hub</text>
<text x="480" y="228" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">account?</text>
<polygon points="480,296 650,352 480,408 310,352" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="348" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">cross_account</text>
<text x="480" y="364" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">enabled?</text>
<polygon points="480,432 650,488 480,544 310,488" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="484" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">allowed_accounts</text>
<text x="480" y="500" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">empty or lists it?</text>
