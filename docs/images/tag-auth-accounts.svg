<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tag-auth-accounts-title tag-auth-accounts-desc" id="tag-auth-accounts-root">
        <title id="tag-auth-accounts-title">Target account gate</title>
        <desc id="tag-auth-accounts-desc">Flowchart: the account in the role ARN continues if it is the hub; otherwise cross_account must be enabled and allowed_accounts must be empty or list it, or the request ends in 403.</desc>
        <defs>
      <style>#tag-auth-accounts-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tag-auth-accounts-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tag-auth-accounts-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tag-auth-accounts-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tag-auth-accounts-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="tag-auth-accounts-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="tag-auth-accounts-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

