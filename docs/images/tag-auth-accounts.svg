<text x="110.0" y="432.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">permission_denied</text>
<rect x="764" y="176" width="172" height="352" rx="20" fill="#f5f5f5"/>
<rect x="764" y="176" width="172" height="352" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="850.0" y="349.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Continue</text>
<text x="850.0" y="364.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">to authorization</text>
<line x1="24" y1="568" x2="936" y2="568" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="24" y="586" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.6">LEGEND</text>
<rect x="24" y="600" width="24" height="14" rx="7" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="56" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Start or end</text>
<rect x="151.28" y="600" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="183.28" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Step</text>
<polygon points="231.04000000000002,607 243.04000000000002,600 255.04000000000002,607 243.04000000000002,614" fill="#ffffff" stroke="#2d3142"/>
<text x="263.04" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Decision</text>
<text x="24" y="632" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">An empty allowed_accounts permits every account, so set it in production.</text>
<text x="24" y="648" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">allowed_accounts IDs that are not 12 digits fail at config load.</text>

      </svg>
