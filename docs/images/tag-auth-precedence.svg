<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 362" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tag-auth-precedence-title tag-auth-precedence-desc" id="tag-auth-precedence-root">
        <title id="tag-auth-precedence-title">Mappings first, tags for unmapped roles</title>
        <desc id="tag-auth-precedence-desc">Left-to-right flow: a mapping that grants the role allows it with mapping settings; otherwise, for a role no mapping names, tag_auth may allow it with no session policy; otherwise the request is denied.</desc>
        <defs>
      <style>#tag-auth-precedence-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tag-auth-precedence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tag-auth-precedence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tag-auth-precedence-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tag-auth-precedence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="tag-auth-precedence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="tag-auth-precedence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

