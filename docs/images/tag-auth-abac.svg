<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 952 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tag-auth-abac-title tag-auth-abac-desc" id="tag-auth-abac-root">
        <title id="tag-auth-abac-title">Session tags carry identity downstream</title>
        <desc id="tag-auth-abac-desc">Three panels: verified claims become STS session tags through the issuer session_tags spec, and a downstream policy condition reads aws:PrincipalTag/repo on every call.</desc>
        <defs>
      <style>#tag-auth-abac-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tag-auth-abac-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tag-auth-abac-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tag-auth-abac-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tag-auth-abac-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="tag-auth-abac-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="tag-auth-abac-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <path d="M272 134 L352 134" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tag-auth-abac-arrow)"/>
<path d="M600 134 L680 134" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#tag-auth-abac-arrow-accent)"/>
<rect x="295.2" y="116" width="33.599999999999994" height="14" rx="2" fill="#f5f5f5"/>
<text x="312" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="1.0">SPEC</text>
<rect x="604.0" y="116" width="72.0" height="14" rx="2" fill="#f5f5f5"/>
<text x="640" y="126" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="1.0">EVERY CALL</text>
<rect x="24" y="28" width="248" height="212" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="52" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Verified claims</text>
<line x1="24" y1="64" x2="272" y2="64" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="38.0" y="88" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">repository: acme/api</text>
<text x="38.0" y="114" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">repository_owner: acme</text>
<text x="38.0" y="140" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">ref: refs/heads/main</text>
<text x="38.0" y="166" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">ref_type: branch</text>
<text x="38.0" y="192" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">event_name: push</text>
<text x="38.0" y="218" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">actor: deploy-bot</text>
<rect x="352" y="28" width="248" height="212" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="366" y="52" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">STS session tags</text>
<line x1="352" y1="64" x2="600" y2="64" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<rect x="358" y="73" width="236" height="22" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="366.0" y="88" fill="#bf4520" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">repo = acme/api</text>
<text x="366.0" y="114" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">repo-owner = acme</text>
