<text x="366.0" y="192" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">event-name = push</text>
<text x="366.0" y="218" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">actor = deploy-bot</text>
<rect x="680" y="28" width="248" height="212" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="694" y="52" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Downstream policy</text>
<line x1="680" y1="64" x2="928" y2="64" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="694.0" y="88" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">"Condition": {</text>
<text x="706.6" y="114" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">"StringEquals": {</text>
<text x="719.2" y="140" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">"aws:PrincipalTag/repo":</text>
<rect x="686" y="151" width="236" height="22" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="731.8" y="166" fill="#bf4520" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">"acme/api"</text>
<text x="706.6" y="192" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">}</text>
<text x="694.0" y="218" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, monospace">}</text>
<line x1="24" y1="264" x2="928" y2="264" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="24" y="288" fill="#4f5d75" font-size="11.5" font-family="'Geist', system-ui, sans-serif">The issuer's session_tags spec picks the tag keys; this is the standard GitHub spec.</text>
<text x="24" y="306" fill="#4f5d75" font-size="11.5" font-family="'Geist', system-ui, sans-serif">Access follows the calling repo, with no per-repo policy to write.</text>

      </svg>
