<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 774" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tag-auth-decision-title tag-auth-decision-desc" id="tag-auth-decision-root">
        <title id="tag-auth-decision-title">Role authorization decision</title>
        <desc id="tag-auth-decision-desc">Flowchart: a verified token passes the target account gate, then an explicit mapping may grant the role; otherwise, when tag_auth is enabled, the role IAM tags are read and matched against the claims; every other path ends in 403.</desc>
        <defs>
      <style>#tag-auth-decision-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tag-auth-decision-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tag-auth-decision-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tag-auth-decision-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tag-auth-decision-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
