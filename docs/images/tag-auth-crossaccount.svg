<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tag-auth-crossaccount-title tag-auth-crossaccount-desc" id="tag-auth-crossaccount-root">
        <title id="tag-auth-crossaccount-title">Cross-account role assumption</title>
        <desc id="tag-auth-crossaccount-desc">Sequence: the workflow sends a token to the warden; for tag-auth only, the warden assumes the spoke to read the target role tags; the warden then assumes the target directly with hub credentials, attaches session tags and returns credentials.</desc>
        <defs>
      <style>#tag-auth-crossaccount-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tag-auth-crossaccount-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tag-auth-crossaccount-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tag-auth-crossaccount-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tag-auth-crossaccount-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="tag-auth-crossaccount-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="tag-auth-crossaccount-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

