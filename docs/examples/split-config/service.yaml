# Service config, owned by the platform team. Role mappings live in mappings.yaml.
issuers:
  - issuer: "https://token.actions.githubusercontent.com"
    provider: "github"
    audiences: ["sts.amazonaws.com"]
default_issuer: "https://token.actions.githubusercontent.com"
role_session_name: "aws-oidc-warden"

# Required for an s3:// mappings_file; sent as ExpectedBucketOwner on config reads.
s3_config_bucket_owner: "111122223333"
mappings_file: "s3://EXAMPLE-BUCKET/mappings.yaml"
config_reload_interval: 60s
# mappings_max_stale: 180s   # default: 3x config_reload_interval; 0 disables

idp:
  enabled: true
  issuer: "https://idp.example.com"
  audience: "idp-audience-example"
  signing_keys:
    - kms_key_id: "arn:aws:kms:eu-west-1:111122223333:key/00000000-0000-0000-0000-000000000000"
      algorithm: ES256
      status: active
  max_session_duration: 4h # >1h: logs config.idp_uncapped at startup by design
  allowed_roles:
    - "arn:aws:iam::111122223333:role/LongDeploy"
