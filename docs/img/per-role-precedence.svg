        <title id="per-role-precedence-title">Per-role settings: what each role gets</title>
        <desc id="per-role-precedence-desc">Matrix of the six per-role settings for one mapping entry, showing the built-in default, the entry value, and the value each of three roles resolves to, where a role setting replaces the entry value and an entry value replaces the built-in default.</desc>
        <defs>
      <style>#per-role-precedence-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #per-role-precedence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #per-role-precedence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#per-role-precedence-root .diagram-container { overflow-x: visible; }
}</style>
