      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #condition-logic-root { font-family: var(--font-sans); color: var(--color-ink); }
      #condition-logic-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#condition-logic-root .diagram-container { overflow-x: visible; }
}</style>
