<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="token-validation-title token-validation-desc" id="token-validation-root">
        <title id="token-validation-title">Token validation pipeline</title>
        <desc id="token-validation-desc">Vertical pipeline of the self-mode token validation steps from the length guard to normalization; any failed step denies the request with 400 or 401 and issues no credentials.</desc>
        <defs>
      <style>#token-validation-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #token-validation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #token-validation-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#token-validation-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="token-validation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="token-validation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="token-validation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <path d="M334 68 L334 88" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 136 L334 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 200 L334 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 264 L334 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 328 L334 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 392 L334 408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 456 L334 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 520 L334 536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M334 584 L334 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<path d="M644 112 L668 112" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M644 176 L668 176" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M644 240 L668 240" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M644 304 L668 304" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M644 368 L668 368" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M644 432 L668 432" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M644 496 L668 496" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M644 560 L668 560" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M668 112 L668 560" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M668 336 L760 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#token-validation-arrow)"/>
<rect x="672" y="318" width="78.39999999999999" height="14" rx="2" fill="#f5f5f5"/>
<text x="676" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">ANY FAILURE</text>
<rect x="154" y="24" width="360" height="44" rx="20" fill="#f5f5f5"/>
<rect x="154" y="24" width="360" height="44" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="334.0" y="50.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Incoming OIDC token and requested role</text>
<rect x="24" y="88" width="620" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="117" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">0</text>
<text x="84" y="108" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Length guard</text>
<text x="84" y="124" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">reject above max_token_bytes (default 8 KB), before any parsing</text>
<rect x="24" y="152" width="620" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="181" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">1</text>
<text x="84" y="172" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Unverified iss peek</text>
<text x="84" y="188" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">read iss for routing only, never for identity or authorization</text>
<rect x="24" y="216" width="620" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="245" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">2</text>
<text x="84" y="236" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Registry lookup</text>
<text x="84" y="252" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">exact issuer match; an unknown issuer denies with no JWKS fetch</text>
<rect x="24" y="280" width="620" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="309" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">3</text>
<text x="84" y="300" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Scoped parser</text>
<text x="84" y="316" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">pinned to the issuer: alg allow-list ES/RS 256-512, exp required</text>
<rect x="24" y="344" width="620" height="48" rx="6" fill="#f5f5f5"/>
<rect x="24" y="344" width="620" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="38" y="373" fill="#bf4520" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">4</text>
<text x="84" y="364" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Verify signature</text>
<text x="84" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">JWKS cache-first; key by kid+alg+type; RSA 2048+; EC curve fits alg</text>
<rect x="24" y="408" width="620" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="437" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">4b</text>
<text x="84" y="428" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Re-assert issuer</text>
<text x="84" y="444" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">verified iss must still equal the matched spec (hot-reload guard)</text>
<rect x="24" y="472" width="620" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="501" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">6-9</text>
<text x="84" y="492" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Claim checks</text>
<text x="84" y="508" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">sub, iat, exp, nbf, lifetime and age caps, audience, required_claims</text>
<rect x="24" y="536" width="620" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="38" y="565" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">10</text>
<text x="84" y="556" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Normalize</text>
<text x="84" y="572" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">derive canonical Subject and raw claims via the provider adapter</text>
<rect x="154" y="600" width="360" height="48" rx="20" fill="#f5f5f5"/>
<rect x="154" y="600" width="360" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="334.0" y="621.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Verified claims</text>
<text x="334.0" y="636.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on to authorization, then credentials</text>
<rect x="760" y="232" width="176" height="208" rx="12" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="848" y="260" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Deny</text>
<text x="848" y="276" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no partial credentials</text>
<text x="848" y="312" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">400</text>
<text x="848" y="328" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">invalid_request</text>
<text x="848" y="343" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">empty or oversized</text>
<text x="848" y="376" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">401</text>
<text x="848" y="392" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">token_invalid</text>
<text x="848" y="407" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every other failure</text>
<line x1="24" y1="664" x2="936" y2="664" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="24" y="682" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.6">LEGEND</text>
<rect x="24" y="696" width="24" height="14" rx="7" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="56" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Start or end</text>
<rect x="151.28" y="696" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="183.28" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Check</text>
<rect x="236.98000000000002" y="696" width="24" height="14" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="268.98" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">The check everything after it relies on</text>
<text x="24" y="728" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Delegated modes (apigw, alb) skip steps 1-4b of this pipeline and join the same claim checks at step 6.</text>

      </svg>
