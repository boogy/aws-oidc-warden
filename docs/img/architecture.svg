<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1152 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
      <title id="architecture-title">AWS OIDC Warden architecture</title>
      <desc id="architecture-desc">A CI job sends its OIDC token through an AWS front-end to the warden's request pipeline, which verifies the token against cached issuer keys, reads policy and role tags from S3 and IAM, and obtains credentials from STS directly or with a token minted by its own IdP service.</desc>
