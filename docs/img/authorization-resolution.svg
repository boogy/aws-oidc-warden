<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authorization-resolution-title authorization-resolution-desc" id="authorization-resolution-root">
        <title id="authorization-resolution-title">How a role grant resolves</title>
        <desc id="authorization-resolution-desc">Flowchart of a request: the roles of every matching mapping are unioned; a role in the union is granted with the settings of the first-declared mapping that grants it; otherwise tag-based authorization may grant it with limited settings, or the request is denied with 403.</desc>
        <defs>
      <style>#authorization-resolution-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #authorization-resolution-root { font-family: var(--font-sans); color: var(--color-ink); }
      #authorization-resolution-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#authorization-resolution-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="authorization-resolution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="authorization-resolution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="authorization-resolution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <path d="M280 84 L280 116" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-resolution-arrow)"/>
<path d="M280 172 L280 204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-resolution-arrow)"/>
<path d="M450 264 L552 264" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#authorization-resolution-arrow-accent)"/>
<path d="M280 324 L280 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-resolution-arrow)"/>
<path d="M450 432 L552 432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-resolution-arrow)"/>
<path d="M280 492 L280 540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-resolution-arrow)"/>
<rect x="466" y="246" width="27.2" height="14" rx="2" fill="#f5f5f5"/>
<text x="470" y="256" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">YES</text>
<rect x="286" y="342" width="20.799999999999997" height="14" rx="2" fill="#f5f5f5"/>
<text x="290" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">NO</text>
<rect x="466" y="414" width="27.2" height="14" rx="2" fill="#f5f5f5"/>
<text x="470" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">YES</text>
<rect x="286" y="510" width="20.799999999999997" height="14" rx="2" fill="#f5f5f5"/>
<text x="290" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">NO</text>
<rect x="140" y="28" width="280" height="56" rx="20" fill="#f5f5f5"/>
<rect x="140" y="28" width="280" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="280.0" y="53.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Verified token</text>
<text x="280.0" y="68.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">target account allowed</text>
<rect x="120" y="116" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280.0" y="141.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Union the roles of every match</text>
<text x="280.0" y="156.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">subject matches, conditions hold</text>
<polygon points="280,204 450,264 280,324 110,264" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="260" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Requested role</text>
<text x="280" y="276" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">in the union?</text>
<rect x="552" y="216" width="384" height="96" rx="20" fill="#f5f5f5"/>
<rect x="552" y="216" width="384" height="96" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="744.0" y="246.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Explicit grant</text>
<text x="744.0" y="261.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">first-declared mapping granting the role</text>
<text x="744.0" y="276.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">supplies session policy, session name,</text>
<text x="744.0" y="291.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">duration, IdP routing and tags</text>
<polygon points="280,372 450,432 280,492 110,432" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="428" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">tag_auth enabled</text>
<text x="280" y="444" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">and tags match?</text>
<rect x="552" y="384" width="384" height="96" rx="20" fill="#f5f5f5"/>
<rect x="552" y="384" width="384" height="96" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="744.0" y="414.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Tag grant</text>
<text x="744.0" y="429.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no mapping, so no session policy,</text>
<text x="744.0" y="444.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">global session name, issuer tags only,</text>
<text x="744.0" y="459.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AssumeRole at most 1h</text>
<rect x="140" y="540" width="280" height="56" rx="20" fill="#f5f5f5"/>
<rect x="140" y="540" width="280" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="280.0" y="565.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">403 permission_denied</text>
<text x="280.0" y="580.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a failed tag lookup also denies</text>
<line x1="24" y1="612" x2="936" y2="612" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="24" y="630" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.6">LEGEND</text>
<rect x="24" y="644" width="24" height="14" rx="7" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="56" y="654" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Start or end</text>
<rect x="151.28" y="644" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="183.28" y="654" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Step</text>
<polygon points="231.04000000000002,651 243.04000000000002,644 255.04000000000002,651 243.04000000000002,658" fill="#ffffff" stroke="#2d3142"/>
<text x="263.04" y="654" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Decision</text>
<line x1="334.56000000000006" y1="651" x2="358.56000000000006" y2="651" stroke="#bf4520" stroke-width="1.3" marker-end="url(#authorization-resolution-arrow-accent)"/>
<text x="366.56000000000006" y="654" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Grant from a mapping</text>
<line x1="509.36000000000007" y1="651" x2="533.3600000000001" y2="651" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#authorization-resolution-arrow)"/>
<text x="541.3600000000001" y="654" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Other path</text>

      </svg>
