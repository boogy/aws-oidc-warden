<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idp-flow-title idp-flow-desc" id="idp-flow-root">
      <title id="idp-flow-title">Warden-as-IdP credential flow</title>
      <desc id="idp-flow-desc">Flowchart: after validation and authorization select the IdP, the warden mints a self-verified token, calls AssumeRoleWithWebIdentity, STS fetches discovery and JWKS from idp.issuer; acceptance returns credentials plus metadata, rejection returns 403 idp_exchange_denied or 503 idp_exchange_unavailable.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #idp-flow-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #idp-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #idp-flow-root .diagram-container { width: 100%; overflow-x: auto; }</style>
        <marker id="idp-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="idp-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M480 68 L480 96" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#idp-flow-arrow-accent)"/>
<path d="M480 144 L480 172" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#idp-flow-arrow-accent)"/>
<path d="M480 220 L480 248" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#idp-flow-arrow-accent)"/>
<path d="M480 296 L480 324" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#idp-flow-arrow-accent)"/>
<path d="M480 372 L480 400" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#idp-flow-arrow-accent)"/>
<path d="M330 456 L256 456" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#idp-flow-arrow-accent)"/>
<path d="M630 456 L704 456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-flow-arrow)"/>
<rect x="268" y="438" width="27.2" height="14" rx="2" fill="#f5f5f5"/>
<text x="272" y="448" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">YES</text>
<rect x="642" y="438" width="20.8" height="14" rx="2" fill="#f5f5f5"/>
<text x="646" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">NO</text>
<rect x="270" y="24" width="420" height="44" rx="20" fill="#f5f5f5"/>
<rect x="270" y="24" width="420" height="44" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="480" y="50.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">POST /verify: token, role, durationSeconds?</text>
<rect x="310" y="96" width="340" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="117.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Validate and authorize</text>
<text x="480" y="132.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the authorizing mapping selects the IdP</text>
<rect x="310" y="172" width="340" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="193.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Mint token</text>
<text x="480" y="208.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">KMS or PEM key; self-verified before use</text>
<rect x="310" y="248" width="340" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="269.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">AssumeRoleWithWebIdentity</text>
<text x="480" y="284.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">unsigned STS call with the minted token</text>
<rect x="310" y="324" width="340" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="345.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">STS fetches discovery and JWKS</text>
<text x="480" y="360.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">public, from idp.issuer</text>
<polygon points="480,400 630,456 480,512 330,456" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="452" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">STS accepts</text>
<text x="480" y="468" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">the minted token?</text>
<rect x="24" y="376" width="232" height="160" rx="20" fill="#f5f5f5"/>
<rect x="24" y="376" width="232" height="160" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="140" y="430.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Credentials</text>
<text x="140" y="445.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ issuer, roleArn,</text>
<text x="140" y="460.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sessionName,</text>
<text x="140" y="475.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sourceIdentity,</text>
<text x="140" y="490.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">durationSeconds, tokenId</text>
<rect x="704" y="376" width="232" height="160" rx="20" fill="#f5f5f5"/>
<rect x="704" y="376" width="232" height="160" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="820" y="445.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">403 / 503</text>
<text x="820" y="460.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">idp_exchange_denied</text>
<text x="820" y="475.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">idp_exchange_unavailable</text>
<line x1="24" y1="568" x2="936" y2="568" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="24" y="586" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.6">LEGEND</text>
<rect x="24" y="600" width="24" height="14" rx="7" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="56" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Start or end</text>
<rect x="152" y="600" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="184" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Step</text>
<polygon points="232,607 244,600 256,607 244,614" fill="#ffffff" stroke="#2d3142"/>
<text x="264" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Decision</text>
<line x1="336" y1="607" x2="360" y2="607" stroke="#bf4520" stroke-width="1.3" marker-end="url(#idp-flow-arrow-accent)"/>
<text x="368" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Credential path</text>
<line x1="482" y1="607" x2="506" y2="607" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#idp-flow-arrow)"/>
<text x="514" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Other path</text>
    </svg>
