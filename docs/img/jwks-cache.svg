<text x="480" y="300" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">the keys?</text>
<polygon points="480,368 630,424 480,480 330,424" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="420" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Refetch allowed</text>
<text x="480" y="436" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">for this kid?</text>
<rect x="330" y="504" width="300" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="525.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Forced refetch</text>
<text x="480" y="540.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bypasses the cache</text>
<polygon points="480,576 630,632 480,688 330,632" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="628" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Kid found</text>
<text x="480" y="644" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">after refetch?</text>
<rect x="24" y="232" width="232" height="456" rx="20" fill="#f5f5f5"/>
<rect x="24" y="232" width="232" height="456" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="140" y="457.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Verify signature</text>
<text x="140" y="472.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">with the matched key</text>
<rect x="704" y="376" width="232" height="312" rx="20" fill="#f5f5f5"/>
<rect x="704" y="376" width="232" height="312" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="820" y="491.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">401</text>
<text x="820" y="506.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">token_invalid</text>
<text x="820" y="521.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle"></text>
<text x="820" y="536.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">limits: 60s per kid,</text>
<text x="820" y="551.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2s per issuer;</text>
<text x="820" y="566.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a failed fetch</text>
<text x="820" y="581.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">also denies</text>
