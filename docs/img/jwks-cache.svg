<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 774" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jwks-cache-title jwks-cache-desc" id="jwks-cache-root">
      <title id="jwks-cache-title">JWKS cache and key rotation</title>
      <desc id="jwks-cache-desc">Flowchart: a matched issuer's JWKS is read from the cache or fetched and stored; if the token's kid is missing, one rate-limited forced refetch runs, and a key still missing, a refused refetch or a failed fetch ends in 401.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #jwks-cache-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #jwks-cache-root { font-family: var(--font-sans); color: var(--color-ink); }
      #jwks-cache-root .diagram-container { width: 100%; overflow-x: auto; }</style>
        <marker id="jwks-cache-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="jwks-cache-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
