<path d="M630 152 L704 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jwks-cache-arrow)"/>
<path d="M760 200 L760 280 Q760 288 752 288 L638 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#jwks-cache-arrow)"/>
