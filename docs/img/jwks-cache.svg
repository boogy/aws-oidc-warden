<text x="480" y="50.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Issuer matched in registry</text>
<polygon points="480,96 630,152 480,208 330,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="148" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">JWKS for this</text>
<text x="480" y="164" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">issuer cached?</text>
<rect x="704" y="104" width="232" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="820" y="134.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Fetch and store</text>
<text x="820" y="149.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">failure cooldown,</text>
<text x="820" y="164.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">singleflight, SSRF-hardened;</text>
<text x="820" y="179.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cached for cache.ttl</text>
