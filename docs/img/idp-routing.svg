<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idp-routing-title idp-routing-desc" id="idp-routing-root">
        <title id="idp-routing-title">How the credential path is chosen</title>
        <desc id="idp-routing-desc">Flowchart of credential routing: an IdP mapping with the IdP enabled uses AssumeRoleWithWebIdentity; otherwise a request of one hour or less uses AssumeRole; anything longer is refused with 400, 403 or 503 and never shortened.</desc>
        <defs>
      <style>#idp-routing-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #idp-routing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #idp-routing-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#idp-routing-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="idp-routing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="idp-routing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="idp-routing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <path d="M440 84 L440 112" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-routing-arrow)"/>
<path d="M590 172 L660 172" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#idp-routing-arrow-accent)"/>
<path d="M440 232 L440 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-routing-arrow)"/>
<path d="M570 336 L660 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-routing-arrow)"/>
<path d="M440 392 L440 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-routing-arrow)"/>
<path d="M330 496 L184 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-routing-arrow)"/>
<path d="M550 496 L660 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-routing-arrow)"/>
<path d="M440 552 L440 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#idp-routing-arrow)"/>
<rect x="594" y="154" width="27.2" height="14" rx="2" fill="#f5f5f5"/>
<text x="598" y="164" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">YES</text>
<rect x="446" y="250" width="20.799999999999997" height="14" rx="2" fill="#f5f5f5"/>
<text x="450" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">NO</text>
<rect x="584" y="318" width="27.2" height="14" rx="2" fill="#f5f5f5"/>
<text x="588" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">YES</text>
<rect x="446" y="410" width="20.799999999999997" height="14" rx="2" fill="#f5f5f5"/>
<text x="450" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">NO</text>
<rect x="202" y="478" width="97.6" height="14" rx="2" fill="#f5f5f5"/>
<text x="206" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">1 NO IDP BLOCK</text>
<rect x="564" y="478" width="65.6" height="14" rx="2" fill="#f5f5f5"/>
<text x="568" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">3 IDP OFF</text>
<rect x="446" y="570" width="97.6" height="14" rx="2" fill="#f5f5f5"/>
<text x="450" y="580" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.0">2 NOT ELIGIBLE</text>
<rect x="300" y="28" width="280" height="56" rx="20" fill="#f5f5f5"/>
<rect x="300" y="28" width="280" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="440.0" y="53.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Role authorized</text>
<text x="440.0" y="68.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the mapping picks the path</text>
<polygon points="440,112 590,172 440,232 290,172" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="168" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">IdP mapping</text>
<text x="440" y="184" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">and IdP on?</text>
<rect x="660" y="132" width="276" height="80" rx="20" fill="#f5f5f5"/>
<rect x="660" y="132" width="276" height="80" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="798.0" y="161.55" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">AssumeRoleWithWebIdentity</text>
<text x="798.0" y="176.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">minted token, every request incl. short</text>
<text x="798.0" y="191.55" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ceiling: max_session_duration</text>
<polygon points="440,280 570,336 440,392 310,336" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="332" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Requested</text>
<text x="440" y="348" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">1h or less?</text>
<rect x="660" y="296" width="276" height="80" rx="20" fill="#f5f5f5"/>
<rect x="660" y="296" width="276" height="80" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="798.0" y="333.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">AssumeRole</text>
<text x="798.0" y="348.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ceiling: 1h, or the mapping's lower</text>
<polygon points="440,440 550,496 440,552 330,496" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="492" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Refused:</text>
<text x="440" y="508" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">why?</text>
<rect x="24" y="456" width="160" height="80" rx="20" fill="#f5f5f5"/>
<rect x="24" y="456" width="160" height="80" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="104.0" y="493.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">400</text>
<text x="104.0" y="508.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">duration_exceeds_cap</text>
<rect x="330" y="600" width="220" height="64" rx="20" fill="#f5f5f5"/>
<rect x="330" y="600" width="220" height="64" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="440.0" y="629.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">403</text>
<text x="440.0" y="644.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">idp_not_permitted</text>
<rect x="660" y="448" width="276" height="96" rx="20" fill="#f5f5f5"/>
<rect x="660" y="448" width="276" height="96" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="798.0" y="478.05" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">503</text>
<text x="798.0" y="493.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">idp_signing_unavailable</text>
<text x="798.0" y="508.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">idp.enabled: false, or the</text>
<text x="798.0" y="523.05" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">block added after startup</text>
<line x1="24" y1="684" x2="936" y2="684" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="24" y="702" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="1.6">LEGEND</text>
<rect x="24" y="716" width="24" height="14" rx="7" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="56" y="726" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Start or end</text>
<polygon points="151.28,723 163.28,716 175.28,723 163.28,730" fill="#ffffff" stroke="#2d3142"/>
<text x="183.28" y="726" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Decision</text>
<line x1="254.8" y1="723" x2="278.8" y2="723" stroke="#bf4520" stroke-width="1.3" marker-end="url(#idp-routing-arrow-accent)"/>
<text x="286.8" y="726" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">IdP path</text>
<line x1="358.32000000000005" y1="723" x2="382.32000000000005" y2="723" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#idp-routing-arrow)"/>
<text x="390.32000000000005" y="726" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Other path</text>
<text x="24" y="748" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">IdP mapping: max_session_duration over 1h, or idp_token: true. Refusals are checked in the numbered order; none shortens the session.</text>
<text x="24" y="764" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Over the ceiling on either credential path: 400 duration_exceeds_cap.</text>

      </svg>
