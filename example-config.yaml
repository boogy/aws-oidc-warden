####################################################################################
# AWS OIDC Warden — Example Configuration (v3, multi-issuer)
#
# Validates OIDC tokens from ANY number of issuers/providers and brokers
# short-lived AWS credentials. Precedence: AOW_-prefixed env vars > this file >
# defaults. See docs/CONFIGURATION.md for the full reference,
# docs/MIGRATION_V3.md if you are upgrading a v2 `conditions:` block, and
# docs/MIGRATION_V2.md if you are coming from a v1 single-issuer config.
####################################################################################

####################################################################################
# TRUSTED OIDC ISSUERS
#
# Each entry is one trusted issuer. The `iss` claim is matched EXACTLY (no
# normalization). At least one issuer is required; each needs at least one
# audience. If no config source is found at all, a single default GitHub
# Actions issuer is seeded automatically — but a present config that defines no
# issuers is a hard error (the seed never masks a misconfigured file).
####################################################################################
issuers:
  # --- GitHub Actions (native provider) ---
  - issuer: "https://token.actions.githubusercontent.com"
    # provider "github" natively unmarshals the full GitHub claim set and
    # defaults the canonical `subject` to the `repository` claim.
    provider: "github"
    audiences:
      - "sts.amazonaws.com"
    # jwks_uri is optional; omit to use OIDC discovery
    # (<issuer>/.well-known/openid-configuration).
    # claim_mappings is optional for github (subject defaults to `repository`);
    # override only to key authorization on a different claim.
    # claim_mappings:
    #   subject: "repository"
    required_claims:
      - "repository"
    # session_tags: STS tag key <- raw claim name. Tag KEYS must be written
    # lower-case, matching [a-z0-9 _.:/=+@-]{1,128}: the config loader
    # case-folds every key it reads, so "CostCenter" is attached to the STS
    # session as "costcenter". Key your ABAC policies on the lower-case form.
    # NOTE (v2 change): the `repo` tag now carries the FULL "owner/repo"
    # (raw `repository` claim); v1 stripped the owner.
    session_tags:
      repo: "repository"
      repo-owner: "repository_owner"
      ref: "ref"
      ref-type: "ref_type"
      actor: "actor"
      event-name: "event_name"

  # --- GitLab CI (generic provider) ---
  # A non-github provider is "generic": it has no native struct, so it MUST map
  # the canonical `subject` from a provider claim via claim_mappings.subject.
  - issuer: "https://gitlab.com"
    provider: "generic"
    audiences:
      - "https://gitlab.com" # GitLab's default OIDC audience is the instance URL
    claim_mappings:
      subject: "project_path" # e.g. "mygroup/myproject"
    required_claims:
      - "project_path"
    session_tags:
      project: "project_path"
      ref: "ref"
      ref-type: "ref_type"

## AWS role session name (identifies the session in CloudTrail). STS accepts
## 2-64 characters from [\w+=,.@-] ("/" is NOT allowed, so a GitHub
## "owner/repo" subject cannot be used verbatim); an invalid value fails at
## boot rather than being silently reshaped. A role_mappings/role_groups entry
## may set its own role_session_name to override this for the roles it
## grants — see role_mappings below.
role_session_name: aws-oidc-warden

## default_issuer: the issuer a role_mapping/role_group inherits when it does
## not set its own `issuer`. Required to resolve unbound mappings when more than
## one issuer is configured. Must reference an issuer defined above.
default_issuer: "https://token.actions.githubusercontent.com"
## NOTE: because this file configures two issuers and leaves most mappings
## unbound to demonstrate the inheritance, it emits an advisory WARN at boot
## naming the mapping count. That is expected HERE; in a real multi-issuer
## config, set `issuer:` explicitly on every mapping and the WARN goes away.

####################################################################################
# TOKEN HARDENING KNOBS (all optional; shown with their defaults)
####################################################################################
## Clock-skew leeway applied to exp/nbf/iat. Default 30s; hard maximum 120s
## (Validate() rejects anything higher). 0 means "use default", not "disable".
jwt_leeway: "30s"
## Cap token replay window. Default 1h; 0/unset means "use default", not "no cap".
max_token_lifetime: "1h" # reject if exp-iat exceeds this
max_token_age: "1h" # reject if now-iat exceeds this
## Reject tokens longer than this many bytes BEFORE parsing. Default 8192.
## 0 means "use default", not "unbounded".
max_token_bytes: 8192
## Minimum interval between forced JWKS refetches per (issuer, kid). Default 60s.
jwks_refetch_cooldown: "60s"
## Dev/test ONLY: permit http:// (loopback) issuer/jwks_uri. NEVER in production.
allow_insecure_issuers: false

####################################################################################
# LOGGING & AUDIT
####################################################################################
## slog level: debug | info | warn | error (default "info").
log_level: "info"
## On by default: claim VALUES (canonical subject, raw sub, audience,
## session-tag values, repository/ref/actor — including the GitHub actor
## username) are included in BOTH the log stream and the audit records, so
## each record identifies who made the request. Set false to suppress claim
## values, keeping only claim NAMES + decision + reason.
log_claim_values: true
## audit_required defaults to true: each allow decision's audit record is
## written to S3 before credentials are returned (fail-closed). It stays
## inactive until log_to_s3 + log_bucket are set, and says so with a warning
## at boot — expected when running this example, where log_to_s3 is false
## below. Commenting the key out does NOT silence that warning, because true
## is the default; only setting it to false does, and that opts out of the
## fail-closed guarantee. Left commented to show the default rather than
## restate it.
# audit_required: true
## RECOMMENDED: mark every session tag transitive so the requester's identity
## survives role chaining. Without this, tags are dropped the moment a target
## role assumes another role, and any ABAC policy past that hop can no longer
## tell who the original caller was — the audit trail and your tag-based
## conditions both go blind at the first hop.
##
## Off by default only for upgrade safety: transitive tags are immutable
## downstream, so enabling this breaks a target role that re-tags with the same
## keys while chaining. If yours does not (the common case), turn it on.
# session_tags_transitive: true
## Persist logs/audit records to S3 (in addition to CloudWatch).
log_to_s3: false
log_bucket: "aws-oidc-warden-logs"
log_prefix: "logs/"

####################################################################################
# JWKS CACHE
####################################################################################
cache:
  ## "memory" (default, per-container LRU), "dynamodb" (persistent/shared), or
  ## "s3" (large/cold objects).
  type: "memory"
  ttl: 4h
  max_local_size: 20
  # dynamodb_table: "aws-oidc-warden-cache"
  # s3_bucket: "arn:aws:s3:::aws-oidc-warden-cache"
  # s3_prefix: "jwks-cache"
  # s3_cleanup: true

####################################################################################
# S3 (session policies + optional remote config)
####################################################################################
## Bucket holding session-policy files referenced by session_policy_file below.
session_policy_bucket: "aws-oidc-warden-session-policies"

## Load the primary config from S3 (Lambda). When set, the service can
## hot-reload it on an interval without redeploying.
# s3_config_bucket: "aws-oidc-warden-config"
# s3_config_path: "config.yaml"
# config_reload_interval: "5m"   # 0 (default) disables reloading

####################################################################################
# CONFIG FRAGMENTS (optional, for scaling to thousands of mappings)
#
# Additional sources merged onto this base config on load/reload. A fragment
# may ONLY contribute role_mappings / role_groups / role_sets / default_issuer
# — issuers, hardening knobs, allow_insecure_issuers and tag_auth are base-only
# and REJECTED if a fragment tries to set them. A failed/invalid fragment
# retains the last-good config (fail-safe reload). Local filesystem paths are
# read directly and work today; "scheme://" URIs (e.g. s3://) resolve through
# an injected fetcher that the shipped binaries do NOT wire up yet — do not
# use remote fragment URIs in production until a fetcher is configured.
####################################################################################
# config_fragments:
#   - "/etc/aws-oidc-warden/fragments/team-a.yaml"
#   - "/etc/aws-oidc-warden/fragments/local.yaml"
## Optional integrity pin per fragment path (sha256 of the file contents).
# config_fragment_checksums:
#   - uri: "/etc/aws-oidc-warden/fragments/team-a.yaml"
#     checksum: "sha256:..."

####################################################################################
# ROLE SETS (named, reusable role lists; reference with "@name" in roles)
####################################################################################
role_sets:
  # Map keys are plain names; reference them from a mapping's `roles` as "@name".
  readonly:
    - arn:aws:iam::123456789012:role/github-actions-readonly
  deployers:
    - arn:aws:iam::123456789012:role/github-actions-deploy
    - arn:aws:iam::123456789012:role/github-actions-create-repo

####################################################################################
# ROLE MAPPINGS (provider-neutral authorization)
#
# Each mapping binds a `subject` PATTERN (auto-anchored ^(?:...)$) to a set of
# assumable roles, scoped to a single issuer, optionally gated by `conditions`.
# The requested role must be one of the mapping's resolved roles — a token can
# never select an arbitrary role. `issuer` defaults to default_issuer above.
# Every key under `conditions` (other than the boolean groups) is the RAW
# verified claim name it checks, and its value is one anchored regex or a LIST
# of regexes, any of which may match. Entries at the same level are AND'd;
# `all_of`/`any_of`/`none_of` groups nest inside for richer logic. A claim whose
# value is itself a list matches when any element does.
#
# Four keys are reserved and are NOT claim names: `all_of`, `any_of`,
# `none_of`, and `claims`. A claim actually named like one of them goes under
# `claims:`, whose keys are always raw claim names (see the release mapping).
#
# v3 removed the three keys that did not match their claim: `branch` -> `ref`,
# `actor_matches` -> `actor`, `environment` -> `runner_environment`. NOTE that
# `environment` still exists as a key — it now checks GitHub's deployment
# environment claim, NOT the runner type. See docs/MIGRATION_V3.md.
#
# SHAPES THAT ARE REJECTED AT LOAD (each reads as a gate and gates nothing, so
# the service refuses to start rather than authorizing more than the file says):
#
#   conditions:              # the key with nothing under it, `conditions: {}`,
#   conditions: {}           # and an explicit `conditions: null` alike —
#                            # an unconditional mapping OMITS the key
#   conditions:
#     ref:                   # a claim key with no pattern
#     event_name: ""         # an empty pattern
#     actor: []              # an empty list
#     repository: ".*"       # a bare wildcard (subjects too) — be specific
#   conditions:
#     any_of: []             # an empty group, or a group member that gates
#     none_of: [{}]          # nothing: always-true members make any_of always
#                            # pass and none_of always fail
#
# ONE THAT LOADS BUT DENIES: a v2 `branch:`/`actor_matches:`, now read as a
# claim of that literal name, which GitHub does not issue — a boot WARN names
# the key. (A camelCase claim key such as `emailVerified:` is fine: viper
# lower-cases it, and claim lookup falls back to a case-insensitive match.)
####################################################################################
role_mappings:
  # Simple mapping, main branch only (inherits default_issuer = GitHub).
  - subject: "org/some-repo-name"
    roles: ["@deployers"] # role_set alias
    conditions:
      ref: "refs/heads/main"

  # External session policy file in S3. This mapping names its role directly
  # rather than reusing @deployers: a role granted BOTH here and by a
  # policy-less mapping earlier in the file would trip the unscoped-grant WARN
  # at boot, because that check shares roles rather than computing subject
  # overlap (see warnUnscopedRoleGrants). Keeping scoped roles distinct from
  # unscoped ones is the habit worth copying.
  - subject: "org/main-branch-repo"
    session_policy_file: "session-policies/org/main-branch-repo/policy.json"
    roles:
      - arn:aws:iam::123456789012:role/github-actions-scoped-deploy
    conditions:
      ref: "refs/heads/main"

  # Inline session policy + subject pattern for many repos. role_session_name
  # here names the WHOLE matched set, not each repository individually — it
  # is a static string, not a template. Per-repository names require one
  # mapping per repository, as in the other entries on this page.
  - subject: "org/service-.*"
    roles: ["@readonly"]
    session_policy: >
      {"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":["iam:*"],"Resource":"*"}]}
    role_session_name: "org-services"

  # Multiple conditions: different claims are AND'd, a list within one claim
  # is OR'd. Any raw claim name works — there is no fixed field list.
  - subject: "org/prod-repo"
    roles:
      - arn:aws:iam::123456789012:role/github-actions-prod
    conditions:
      ref: "refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+"
      ref_type: "tag"
      environment: "production" # the deployment environment the job declares
      runner_environment: "github-hosted" # the runner type (a different claim)
      actor: ["release-bot", "release-manager"] # OR: either actor satisfies it
      sha: "[0-9a-f]{40}" # patterns are auto-anchored; no ^...$ needed
    # Overrides the global role_session_name for roles granted by THIS
    # mapping only, so CloudTrail names the requester instead of the service.
    role_session_name: "org-prod-repo-deploy"

  # Boolean conditions. The top level is still an implicit AND: every flat
  # field AND every group below must hold. Groups nest up to 5 levels deep.
  #
  #   all_of  — every listed condition must hold
  #   any_of  — at least one listed condition must hold
  #   none_of — no listed condition may hold (a one-entry none_of is a "not")
  #
  # This reads: a tag build, from a release tag or a hotfix tag, never on the
  # sandbox runner.
  - subject: "org/release-repo"
    roles:
      - arn:aws:iam::123456789012:role/github-actions-release
    conditions:
      ref_type: "tag" # flat field: AND'd with both groups below
      any_of:
        - ref: "refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+"
        - all_of:
            - ref: "refs/tags/hotfix-.+"
            - actor: ["release-bot", "release-manager"]
      none_of:
        - runner_environment: "self-hosted"
      # `claims:` keys are ALWAYS raw claim names — the escape hatch for a
      # claim named like a reserved key. Otherwise identical to a top-level
      # entry, AND'd with everything else on this node.
      claims:
        environment: "production"

  # Pin a REUSABLE WORKFLOW. `workflow_ref` is the entry workflow the run
  # started from; `job_workflow_ref` is the workflow the job actually executes,
  # which is what a caller cannot fake by copying a job into its own repo. Pin
  # the reusable workflow to a tag or a SHA, never to a branch a caller can move.
  - subject: "org/.+"
    roles: ["@deployers"]
    conditions:
      job_workflow_ref: "org/ci-workflows/\\.github/workflows/deploy\\.yml@refs/tags/v[0-9]+"
      repository_owner: "org" # only this org's repos may call it
      runner_environment: "github-hosted"

  # PULL-REQUEST gate: a PR job may read, but only from a public repo, only
  # from a branch targeting main, and never from a fork's self-hosted runner.
  # `ref_protected` is a STRING claim ("true"/"false"), not a boolean — quote it.
  - subject: "org/pr-checks"
    roles: ["@readonly"]
    conditions:
      event_name: "pull_request"
      base_ref: "main"
      repository_visibility: "public"
      ref_protected: "true"

  # Match on IMMUTABLE IDs rather than names. A repo or org can be renamed, and
  # the new owner of a freed-up name inherits every mapping written against it;
  # the numeric IDs never change hands. Belt and braces: name AND id.
  - subject: "org/high-value-repo"
    roles:
      - arn:aws:iam::123456789012:role/github-actions-sensitive
    conditions:
      repository_id: "123456789"
      repository_owner_id: "987654"
      ref: "refs/heads/main"

  # `none_of` is exact negation, and each MEMBER is a whole condition — a
  # member with two keys is a negated AND (it vetoes only when BOTH hold).
  # Write one member per thing you mean to refuse, as here: never a fork's
  # self-hosted runner, and never a manually dispatched run.
  - subject: "org/guarded-repo"
    roles: ["@readonly"]
    conditions:
      ref: "refs/heads/(main|release/.+)"
      none_of:
        - runner_environment: "self-hosted"
        - event_name: "workflow_dispatch"

  # A GitLab mapping — bound explicitly to the GitLab issuer. Its `subject` is
  # the canonical value produced by claim_mappings.subject (project_path).
  # Conditions use the same syntax for any provider: the key is whatever the
  # issuer calls the claim, so no GitLab-specific fields are needed.
  - subject: "mygroup/myproject"
    issuer: "https://gitlab.com"
    roles:
      - arn:aws:iam::123456789012:role/gitlab-ci-deploy
    conditions:
      ref: "main"
      project_path: "mygroup/myproject"
      groups: ["platform-team", "sre"] # list claim: matches when any element does

####################################################################################
# ROLE GROUPS (DRY: one entry expands to one mapping per subject, sharing
# issuer + defaults). Great for onboarding many repos with identical access.
####################################################################################
role_groups:
  - issuer: "https://token.actions.githubusercontent.com"
    subjects:
      - "org/frontend"
      - "org/backend"
      - "org/mobile"
    defaults:
      roles: ["@readonly"]
      conditions:
        event_name: "push"
      # Applies to every subject this group expands to (org/frontend,
      # org/backend, org/mobile) — one name for the whole group, not one per
      # subject.
      role_session_name: "org-readonly-group"

####################################################################################
# TAG-BASED AUTHORIZATION (optional, default disabled) — enterprise-scale path.
#
# When enabled, a role whose IAM tags authorize a token's claims may be assumed
# even without a role_mapping. v2 is ISSUER-BOUND: set aow/issuer on the role;
# the canonical identity tag is aow/subject (aow/repo + aow/repo-owner remain
# accepted as aliases through the v2 migration window). See
# docs/TAG_BASED_AUTHORIZATION.md.
####################################################################################
# Supported tags (prefix configurable below). Values match EXACTLY — AWS tag
# values cannot carry regex — and a space-separated value means OR:
#
#   aow/subject            canonical subject; identity tag (required, or a
#                          legacy aow/repo / aow/repo-owner alias)
#   aow/issuer             verified iss; REQUIRED once >1 issuer is configured
#   aow/branch             full ref or short branch name (tag-only convenience)
#   aow/ref                ref            aow/ref-type          ref_type
#   aow/event-name         event_name     aow/workflow-ref      workflow_ref
#   aow/actor              actor
#   aow/environment        environment          (deployment environment)
#   aow/runner-environment runner_environment   (github-hosted/self-hosted)
#
#   aow/claim.<name>       the raw verified claim <name>, for ANY issuer
#                          e.g. aow/claim.project_path: acme/api  (GitLab)
#                               aow/claim.groups: platform sre    (list claim)
#                          Every suffix above names a GitHub Actions claim;
#                          this is how a non-GitHub issuer constrains anything
#                          beyond aow/subject. ANDs with the rest, and is NOT
#                          an identity tag, so it can only narrow access.
#                          Case-SENSITIVE (IAM keeps tag keys verbatim).
#
# CHANGED IN 3.0.0: aow/environment used to check runner_environment. Retag
# such roles aow/runner-environment — until then they simply stop matching.
tag_auth:
  enabled: false
  tag_prefix: "aow/"
  default_org: "" # if set, bare aow/repo tokens (e.g. "api") expand to "<default_org>/api"
  # Deprecated: use the top-level session_tags_transitive instead (see
  # LOGGING & AUDIT above) — this key never had anything to do with tag_auth.
  transitive_session_tags: false

####################################################################################
# CROSS-ACCOUNT POLICY GATE (optional, default disabled).
#
# false (the default) hard-blocks EVERY cross-account operation — both role
# assumption and, for tag_auth, IAM tag reads — regardless of role_mappings or
# tag_auth settings. Role assumption is always DIRECT: hub -> target, one hop,
# using the warden's own credentials. The per-account spoke role below is used
# only so tag_auth can read a target role's IAM tags cross-account
# (iam:GetRole); it never assumes the target role itself. Cross-account
# sessions are capped at 1h whenever the warden's own credentials are a role
# session (always true on Lambda, same-account assumes included). See
# docs/examples/cross-account/ for a full worked example including the IAM
# roles.
####################################################################################
cross_account:
  enabled: false
  spoke_role_name: "aow-spoke" # only used for cross-account tag reads (tag_auth)
  external_id: "" # hub->spoke trust only; never sent on the hub->target assume
  spoke_session_duration: "15m"
  allowed_accounts: [] # member account IDs the warden may assume into; [] = ANY once enabled (set in production!)

####################################################################################
# JWT VALIDATION MODE — who verifies the signature.
#
# "self"  (default) full JWKS signature verification here (multi-issuer aware).
# "apigw" trust an API Gateway HTTP API v2 JWT Authorizer (claims from the
#         authorizer context). Any number of configured issuers: each route's
#         Authorizer pins its own, and the verified iss it forwards selects the
#         spec per request.
# "alb"   trust ALB OIDC; the ES256-signed x-amzn-oidc-data header is verified.
#         Requires EXACTLY ONE configured issuer -- an ALB has one OIDC IdP, so
#         a multi-issuer config is genuinely ambiguous there and is rejected at
#         startup. Set alb_expected_signer to the ALB ARN to prevent cross-ALB
#         spoofing.
# Both delegated modes still re-validate issuer/audience/exp/nbf/sub/time-bounds.
####################################################################################
jwt_validation:
  mode: "self"
  # alb_expected_signer: "arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/my-alb/abc"
