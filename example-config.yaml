#   token_ttl: "2m" # 1m..5m, default 2m
#   subject_template: "{role_arn}" # default; must end with {role_arn}
#   include_source_identity: true # default
#   source_identity: "{issuer}:{subject}" # default
#   source_identity_overflow: "truncate" # truncate (default) | reject
#   jwks_uri: "https://idp.warden.example.com/.well-known/jwks.json" # default: issuer + paths.jwks
#   paths:
#     discovery: "/.well-known/openid-configuration" # default
#     jwks: "/.well-known/jwks.json" # default
#   jwks_cache_max_age: "5m" # default
#   sign_timeout: "2s" # default
#   # kms_allowed_regions: ["eu-west-1", "us-east-1"] # required for a multi-region (mrk-) key
#   signing_keys: # max 5, exactly one active; full key ARN, no aliases
