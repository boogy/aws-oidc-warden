#       algorithm: "ES256" # ES256 | RS256
#       status: "active" # active | verify_only
#     # - kms_key_id: "arn:aws:kms:eu-west-1:111122223333:key/mrk-0123456789abcdef0123456789abcdef"
#     #   algorithm: "ES256"
#     #   status: "verify_only"
