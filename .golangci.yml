# golangci-lint configuration (schema v2).
# Shared by `make lint` and the CI lint job so local and CI results match.
# Enabled set mirrors the Makefile `lint-all` target: the standard linters
# (errcheck, govet, ineffassign, staticcheck, unused) plus bodyclose and misspell.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - forbidigo
    - misspell
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^slog\.(Debug|Info|Warn|Error)(Context)?$'
          pkg: '^log/slog$'
          msg: 'log through internal/logevent, not slog directly'
        - pattern: '^slog\.Logger\.(Debug|Info|Warn|Error)(Context)?$'
          pkg: '^log/slog$'
          msg: 'log through internal/logevent, not slog directly'
  exclusions:
    rules:
      - path: internal/logevent/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
